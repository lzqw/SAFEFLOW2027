# P4.2 B1: reward/flow plus global safety, with local geometry disabled.
env_id: SafetyPointGoal1-v0
custom_cfgs:
  train_cfgs:
    eval_episodes: 0
  algo_cfgs:
    enable_global_safety_constraint: true
    enable_local_safety_geometry: false
    use_target_flow_for_reward_backup: false
    actor_update_interval: 1
    reward_target_samples: 1
    reward_critic_updates_per_update: 1
    separate_reward_replay: false
    reward_replay_recent_fraction: 0.0
    reward_replay_recent_window: 10000
    eval_milestones: [0, 50000]
    checkpoint_replay: true
    milestone_checkpoints: true
    full_checkpoint_freq: 10000
