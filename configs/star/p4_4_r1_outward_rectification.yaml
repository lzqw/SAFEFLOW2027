# P4.4 R1 pilot: R0 plus reliability-weighted one-sided outward-drift rectification.
env_id: SafetyPointGoal1-v0
custom_cfgs:
  train_cfgs:
    total_steps: 30000
    eval_episodes: 0
  algo_cfgs:
    enable_global_safety_constraint: true
    enable_local_safety_geometry: false
    use_target_flow_for_reward_backup: true
    actor_update_interval: 2
    reward_target_samples: 4
    reward_critic_updates_per_update: 2
    separate_reward_replay: true
    reward_replay_recent_fraction: 0.5
    reward_replay_recent_window: 10000
    reward_target_polyak: 0.001
    bellman_probability_enabled: true
    probability_mc_aux_weight: 0.10
    probability_target_polyak: 0.005
    heldout_episode_period: 5
    heldout_recent_episodes: 20
    heldout_eval_batch_size: 20000
    complete_heldout_evidence: true
    heldout_min_positive_labels: 256
    heldout_min_negative_labels: 256
    dynamic_geometry_gate: false
    candidate_probing_enabled: false
    stochastic_flow_enabled: true
    safety_anisotropy_enabled: true
    safety_inward_drift_enabled: false
    safety_outward_rectification_enabled: true
    safety_protocol_version: p4.4-outward-rectification-v1
    safety_protocol_sha256: 005c42348a22f664448c688b3cecc16eba7cbbea55d7727537caeef5d3b69457
    risk_boundary: 0.20
    boundary_bandwidth: 0.10
    risk_ucb_beta: 0.50
    flow_reference_variance: 0.04
    flow_normal_variance_ratio: 0.10
    safety_gradient_scale: 0.005
    safety_ensemble_scale: 0.05
    safety_calibration_auroc_full: 0.75
    safety_calibration_brier_score_scale: 0.25
    safety_drift_strength: 0.20
    safety_drift_temperature: 0.05
    numerical_hard_stops_enabled: true
    reward_td_absolute_hard_stop: 0.02
    reward_q_absolute_hard_stop: 10.0
    reward_td_final_to_minimum_ratio_hard_stop: 3.0
    eval_milestones: [0, 30000]
    checkpoint_replay: true
    milestone_checkpoints: true
    full_checkpoint_freq: 10000
  dual_cfgs:
    energy_initial: 0.004
    target_energy_per_action: 12.5
